services:
  # FastAPI Backend Service
  - type: web
    name: ev-charge-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_NAME
        value: ev_charging_db

  # Angular Frontend Static Site
  - type: web
    name: ev-charge-frontend
    runtime: static
    region: oregon
    plan: static
    rootDir: frontend/ev-charge-angular
    buildCommand: npm install && npm run build -- --configuration production
    staticPublishPath: dist/ev-charge-angular/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
